[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inneros-amd-act3"
version = "0.1.0"
description = "Auditable local-first agentic infrastructure for AMD Developer Hackathon ACT III"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "InnerOS Labs"}]

[project.scripts]
act3-smoke = "inneros_act3.smoke:main"
act3-judge = "inneros_act3.judge_console:main"
act3-server = "inneros_act3.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inneros_act3 = ["web/*.html", "web/*.css", "web/*.js"]
