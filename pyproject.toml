[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inneros-amd-act3"
version = "0.1.0"
description = "Auditable local-first agentic infrastructure for AMD Developer Hackathon ACT III"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "InnerOS Labs"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
