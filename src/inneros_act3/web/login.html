<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070b">
  <title>InnerOS Access — Portal</title>
  <style>
    :root {
      --bg: #05070b;
      --card-bg: #0b111a;
      --border: #1e293b;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --danger: #f43f5e;
      --danger-bg: rgba(244, 63, 94, 0.1);
      --danger-border: rgba(244, 63, 94, 0.3);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.05) 0%, transparent 40%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .container {
      width: 100%;
      max-width: 440px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2.25rem 2rem;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .brand {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.35rem;
      color: #fff;
    }
    .brand span {
      color: var(--accent);
    }
    .brand-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent);
      margin-left: 0.4rem;
      vertical-align: middle;
    }
    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.4;
    }
    .segment-indicator {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      margin-bottom: 1.5rem;
      font-size: 0.78rem;
    }
    .segment-label {
      color: var(--muted);
      font-weight: 500;
    }
    .segment-value {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #38bdf8;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      display: inline-block;
    }
    .alert {
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: #fca5a5;
      padding: 0.75rem 0.9rem;
      border-radius: 8px;
      font-size: 0.82rem;
      line-height: 1.4;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.45rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      background: #080d15;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 0.9rem;
      color: #fff;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.85rem;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 0.5rem;
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, #0369a1, #1d4ed8);
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
      transform: translateY(-1px);
    }
    .btn-submit:active {
      transform: translateY(0);
    }
    .footer-note {
      text-align: center;
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.72rem;
      color: #64748b;
      line-height: 1.5;
    }
    .footer-note span {
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="header">
        <div class="brand">Inner<span>OS</span> <span class="brand-badge">Access</span></div>
        <div class="subtitle">Autonomous Agentic Operations &middot; ACT III Evaluation</div>
      </div>

      <div class="segment-indicator">
        <span class="segment-label">Target Segment</span>
        <span class="segment-value"><span class="pulse-dot"></span> judge_act3</span>
      </div>

      {{ALERT_SECTION}}

      <form method="POST" action="/login" autocomplete="off">
        <input type="hidden" name="next" value="{{NEXT_PATH}}">
        <div class="form-group">
          <label for="username">Evaluator Identifier</label>
          <input type="text" id="username" name="username" value="{{PREFILL_USER}}" placeholder="e.g. amd-judge" required autofocus>
        </div>
        <div class="form-group">
          <label for="password">Access Credential</label>
          <input type="password" id="password" name="password" placeholder="••••••••••••" required>
        </div>
        <button type="submit" class="btn-submit">
          Authenticate &amp; Enter &rarr;
        </button>
      </form>

      <div class="footer-note">
        Authorized evaluation access only. Sessions are <span>HMAC-SHA256 signed</span> and rate-limited.
      </div>
    </div>
  </div>
</body>
</html>
